<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="raag.css"/>  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <nav>
        <ul>
            <li class="brand"><img src="images/logo.png" alt="Spotify"> Spotify</li>
            <li><a href="../home/home.html">Home</a></li>
            <li><a href="../aboutme/aboutme.html">Aboutme</a></li>
        </ul>
    </nav>

    <div id="Container">
        <h1 id="name"> RaagRoshan(Shashank saurabh) Song List </h1>

        <div class="FirstsongList">
            <div class="A" data-song="1.mp3">
                <div class="AB"><span class="songBanner">Sandese Aate Hai <div><span class="timestamp">4:25</span></div></span></div>
                <div class="play-icon"><i class="fa-solid fa-play"></i></div>
            </div>
            <div class="B" data-song="2.mp3">
                <div class="AB"><span class="songBanner"> Aisi teri Yaadein<div><span class="timestamp">1:14</span></div></span></div>
                <div class="play-icon"><i class="fa-solid fa-play"></i></div>
            </div>
            <div class="C" data-song="3.mp3">
                <div class="AB"><span class="songBanner">Chathi Maiya Bulaye <div><span class="timestamp">2:11</span></div></span></div>
                <div class="play-icon"><i class="fa-solid fa-play"></i></div>
            </div>
            <div class="D" data-song="4.mp3">
                <div class="AB"><span class="songBanner">Kaha Ho Tum <div><span class="timestamp">1:31</span></div></span></div>
                <div class="play-icon"><i class="fa-solid fa-play"></i></div>
            </div>
            <div class="E" data-song="5.mp3">
                <div class="AB"><span class="songBanner">Kaise Huaa <div><span class="timestamp">1:46</span></div></span></div>
                <div class="play-icon"><i class="fa-solid fa-play"></i></div>
            </div>
            <div class="F" data-song="6.mp3">
                <div class="AB"><span class="songBanner">Teri Yaasein <div><span class="timestamp">2:24</span></div></span></div>
                <div class="play-icon"><i class="fa-solid fa-play"></i></div>
            </div>
        </div>

       

    </div>

    <div id="bottom">  
        <div class="icon">     
            <button id="prevBtn"><i class="fa-solid fa-backward"></i></button>
            <button id="playPauseBtn"><i class="fa-solid fa-play"></i></button>
            <button id="nextBtn"><i class="fa-solid fa-forward"></i></button>
        </div> 
        <input type="range" id="myProgressBar" min="0" value="0" max="100">
        <div class="gifinfo">
            <img src="images/playing.gif" width="70px" alt="" id="gif"> <span id="SongName"> Let me Love You........... </span>
        </div>
    </div>

    <script src="raag.js"></script> 
    <script src="https://kit.fontawesome.com/26504e4a1f.js" crossorigin="anonymous"></script> 
</body>
</html>
